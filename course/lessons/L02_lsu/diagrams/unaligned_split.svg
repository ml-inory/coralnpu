<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="450" viewBox="0 0 1020 450">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1020" height="450" fill="#ffffff"/>
<text x="24" y="34" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">非对齐字存储 sw 0xAABBCCDD, 3(s5)：拆成两笔事务</tspan></text>
<text x="24" y="104" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="24" dy="0">字 0（地址 A）</tspan></text>
<rect x="210" y="80" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="270" y="102" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="270" dy="0">byte0</tspan></text>
<text x="270" y="124" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="270" dy="0">44</tspan></text>
<rect x="330" y="80" width="120" height="56" rx="8" ry="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
