<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1040" height="380" fill="#ffffff"/>
<text x="24" y="34" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">LSU 状态机：一次访存指令 → 1~2 笔对齐事务</tspan></text>
<rect x="40" y="90" width="180" height="86" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="130.0" y="120.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="130.0" dy="0">IDLE</tspan><tspan x="130.0" dy="16.875">空闲</tspan><tspan x="130.0" dy="16.875">busy=0, done=0</tspan></text>
<rect x="300" y="90" width="200" height="86" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/><text x="400.0" y="112.0625" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="400.0" dy="0">REQ</tspan><tspan x="400.0" dy="16.875">发出事务</tspan><tspan x="400.0" dy="16.875">dmem_valid=1</tspan><tspan x="400.0" dy="16.875">等 dmem_ready</tspan></text>
<rect x="590" y="90" width="180" height="86" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="680.0" y="120.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="680.0" dy="0">FINISH</tspan><tspan x="680.0" dy="16.875">完成</tspan><tspan x="680.0" dy="16.875">done=1</tspan></text>
<rect x="840" y="90" width="170" height="86" rx="8" ry="8" fill="#f3f5f7" stroke="#5b6b7b" stroke-width="1.6"/><text x="925.0" y="120.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12.5" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="925.0" dy="0">回到 IDLE</tspan><tspan x="925.0" dy="16.875">等下一</tspan><tspan x="925.0" dy="16.875">条指令</tspan></text>
<path d="M 224 133 L 296 133" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="260.0" y="127.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="260.0" dy="0">req_valid=1</tspan><tspan x="260.0" dy="16.200000000000003">锁存请求</tspan></text>
<path d="M 504 133 L 586 133" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="545.0" y="127.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="545.0" dy="0">ready=1 且</tspan><tspan x="545.0" dy="16.200000000000003">不需要第二笔</tspan></text>
<path d="M 774 133 L 836 133" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 500 180 Q 450.0 198.0 400 236" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="450.0" y="197.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="450.0" dy="0">ready=1 且需要第二笔</tspan><tspan x="450.0" dy="16.200000000000003">step=1，地址 +4</tspan></text>
<rect x="300" y="236" width="200" height="60" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/><text x="400.0" y="270.55" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="400.0" dy="0">再发一笔 REQ</tspan></text>
<path d="M 500 266 Q 580.0 197.0 660 180" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="580.0" y="204.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="580.0" dy="0">ready=1 → FINISH</tspan></text>
<text x="24" y="330" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">核心侧：busy=1 时冻结 PC 与寄存器写回；done=1 的那一拍提交这条指令（写回 / trace / PC+4）。</tspan></text>
<text x="24" y="354" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="12" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">存储器侧：addr/wmask/wdata 在 REQ 期间必须保持不变，直到 ready=1（valid/ready 握手的基本纪律）。</tspan></text>

</svg>
