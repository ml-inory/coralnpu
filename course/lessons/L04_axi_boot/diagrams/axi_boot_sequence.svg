<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1180" height="640" fill="#ffffff"/>
<text x="24" y="32" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">5 步启动流程：为什么必须先放开时钟、再放开复位</tspan></text>
<text x="24" y="58" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">每一列是一个阶段；上下对照着看「主机做了什么」和「核心看到了什么」</tspan></text>
<rect x="30" y="80" width="212" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="136.0" y="139.9" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="136.0" dy="0">① 写 ITCM</tspan></text>
<text x="42" y="176" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="42" dy="0">主机把程序逐字写进</tspan><tspan x="42" dy="17.55">0x0000_0000 起的 8 KB</tspan></text>
<rect x="258" y="80" width="212" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="364.0" y="139.9" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="364.0" dy="0">② 写 PC_START</tspan></text>
<text x="270" y="176" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="270" dy="0">0x30004 ← 0x100</tspan><tspan x="270" dy="17.55">再读回来确认</tspan></text>
<rect x="486" y="80" width="212" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="592.0" y="139.9" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="592.0" dy="0">③ 放开时钟</tspan></text>
<text x="498" y="176" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="498" dy="0">RESET_CONTROL ← 0x1</tspan><tspan x="498" dy="17.55">（RESET 仍然 = 1）</tspan></text>
<rect x="714" y="80" width="212" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="820.0" y="139.9" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="820.0" dy="0">④ 放开复位</tspan></text>
<text x="726" y="176" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="726" dy="0">RESET_CONTROL ← 0x0</tspan><tspan x="726" dy="17.55">（CLOCK_GATE = 0）</tspan></text>
<rect x="942" y="80" width="212" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="1048.0" y="139.9" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="1048.0" dy="0">⑤ 轮询 STATUS</tspan></text>
