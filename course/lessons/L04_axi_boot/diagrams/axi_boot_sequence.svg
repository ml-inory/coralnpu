<text x="24" y="590" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="start"><tspan x="24" dy="0">反例：如果第 3、4 步调换——先放开复位（此时还没有时钟），等时钟来的第一个沿，rst 已经是 0，核心从没见过「复位有效」，寄存器停在未初始化状态（仿真里就是 X，一条指令都不执行）。</tspan></text>
<text x="24" y="626" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">顺序不是随口定的：同步复位需要「一个 rst=1 的时钟沿」才生效，所以时钟必须先开</tspan></text>
