<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1040" height="430" fill="#ffffff"/>
<text x="24" y="32" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">L04 的系统结构：主机启动核心，核心访存走 AXI</tspan></text>
<rect x="30" y="120" width="170" height="80" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="115.0" y="155.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="115.0" dy="0">主机</tspan><tspan x="115.0" dy="17.55">(tb 里的 AXI BFM)</tspan></text>
<rect x="270" y="70" width="190" height="70" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/><text x="365.0" y="100.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="365.0" dy="0">AXI4-Lite 从接口</tspan><tspan x="365.0" dy="17.55">axi_lite_slave</tspan></text>
<rect x="270" y="170" width="190" height="70" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="365.0" y="200.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="365.0" dy="0">控制寄存器</tspan><tspan x="365.0" dy="17.55">RESET / PC_START / STATUS</tspan></text>
<rect x="270" y="270" width="190" height="70" rx="8" ry="8" fill="#f0e9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="365.0" y="300.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="365.0" dy="0">ITCM（tcm.sv）</tspan><tspan x="365.0" dy="17.55">组合读，主机可写</tspan></text>
<rect x="530" y="170" width="170" height="70" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/><text x="615.0" y="200.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="615.0" dy="0">AXI4 主接口</tspan><tspan x="615.0" dy="17.55">AR/R、AW+W/B</tspan></text>
<rect x="760" y="70" width="230" height="90" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="875.0" y="102.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="875.0" dy="0">核心 core_l04</tspan><tspan x="875.0" dy="17.55">= L03b + i_pc_start</tspan><tspan x="875.0" dy="17.55">+ o_fault</tspan></text>
<rect x="760" y="270" width="230" height="80" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="875.0" y="297.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="875.0" dy="0">系统存储器</tspan><tspan x="875.0" dy="17.55">DTCM @0x0001_0000</tspan><tspan x="875.0" dy="17.55">(测试平台)</tspan></text>
<path d="M 204 160 L 266 120" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="235.0" y="134.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="235.0" dy="0">s_axi</tspan></text>
<path d="M 365 144 L 365 166" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 365 244 L 365 266" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 464 100 L 756 100" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="610.0" y="94.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="610.0" dy="0">o_core_rst / o_core_clk_gate / o_core_pc_start</tspan></text>
<path d="M 756 140 L 704 172" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="730.0" y="150.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="730.0" dy="0">imem / dmem</tspan></text>
<path d="M 704 236 L 756 280" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="730.0" y="252.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="730.0" dy="0">m_axi（load/store）</tspan></text>
<path d="M 756 300 L 464 300" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="610.0" y="294.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="610.0" dy="0">取指（组合读）</tspan></text>
<text x="24" y="380" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">启动：① 写 ITCM ② 写 PC_START ③ 放开时钟门控 ④ 放开复位 ⑤ 轮询 STATUS</tspan></text>
<text x="24" y="402" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">数据：核心的每次 load/store 都变成一笔 m_axi 事务；取指走外壳内部的 ITCM</tspan></text>
<text x="24" y="416" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">从接口让主机能启动核心，主接口让核心能访问系统存储器——两条通路用的都是 VALID/READY 握手</tspan></text>
</svg>
