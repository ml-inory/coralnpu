<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1180" height="600" fill="#ffffff"/>
<text x="24" y="32" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">L04 数据通路：核心的每次 load/store，要么命中 ITCM，要么变成一笔 m_axi 事务</tspan></text>
<text x="24" y="58" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#6d28d9" text-anchor="start"><tspan x="24" dy="0">取指是另一条路：i_imem_addr → ITCM 组合读 → o_imem_rdata，永远不出外壳</tspan></text>
<rect x="30" y="200" width="230" height="250" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="50" y="230" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="50" dy="0">核心 core_l04</tspan></text>
<text x="50" y="258" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">imem_addr →（取指）</tspan></text>
<text x="50" y="279" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">← imem_rdata</tspan></text>
<text x="50" y="300" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0"></tspan></text>
<text x="50" y="321" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">dmem 请求 →</tspan></text>
<text x="50" y="342" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">valid / we / addr</tspan></text>
<text x="50" y="363" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">wdata / wmask</tspan></text>
<text x="50" y="384" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0"></tspan></text>
<text x="50" y="405" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">← dmem 回执</tspan></text>
<text x="50" y="426" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="50" dy="0">rdata / ready</tspan></text>
<rect x="340" y="250" width="250" height="145" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="360" y="280" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="start"><tspan x="360" dy="0">核心侧路由（TODO 5）</tspan></text>
<text x="360" y="308" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="360" dy="0">输入：valid / we / addr / wdata / wmask</tspan></text>
<text x="360" y="329" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="360" dy="0">d_hit_itcm：addr &lt; 0x2000</tspan></text>
<text x="360" y="350" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="360" dy="0">命中 → ITCM 组合读，1 拍完成</tspan></text>
<text x="360" y="371" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="360" dy="0">未命中 → d_go_axi = 1</tspan></text>
<rect x="680" y="110" width="250" height="130" rx="8" ry="8" fill="#f0e9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="700" y="140" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="start"><tspan x="700" dy="0">ITCM  tcm.sv</tspan></text>
<text x="700" y="168" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0">组合读：给地址那一拍就出数据</tspan></text>
<text x="700" y="189" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0">核心没有 ready 可以等，</tspan></text>
<text x="700" y="210" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0">所以它必须留在片内</tspan></text>
<rect x="680" y="330" width="250" height="130" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/>
<text x="700" y="360" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="start"><tspan x="700" dy="0">AXI 主状态机（TODO 6）</tspan></text>
<text x="700" y="388" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0">读：IDLE→RADDR→RDATA→IDLE</tspan></text>
<text x="700" y="409" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0">写：IDLE→WADDR→BRESP→IDLE</tspan></text>
<text x="700" y="430" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="700" dy="0">o_dmem_ready 在 R/B 到达时拉高</tspan></text>
<rect x="990" y="330" width="160" height="120" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="1070.0" y="368.225" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1070.0" dy="0">系统存储器</tspan><tspan x="1070.0" dy="17.55">DTCM</tspan><tspan x="1070.0" dy="17.55">@0x0001_0000</tspan><tspan x="1070.0" dy="17.55">（tb 的模型）</tspan></text>
<path d="M 262 320 L 336 320" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="299.0" y="314.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="299.0" dy="0">i_dmem_*</tspan></text>
<polyline points="500,248 500,200 676,200" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="508" y="240" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#6d28d9" text-anchor="start"><tspan x="508" dy="0">命中：交给 ITCM 组合读</tspan></text>
<path d="M 590 360 L 676 360" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="633.0" y="354.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="633.0" dy="0">未命中</tspan></text>
<path d="M 930 395 L 986 395" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="958.0" y="389.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="958.0" dy="0">m_axi</tspan></text>
<text x="1160" y="474" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#b45309" text-anchor="end"><tspan x="1160" dy="0">m_axi 上的两笔：AR/R 或 AW+W/B</tspan></text>
<polyline points="790,108 790,80 150,80 150,196" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
<text x="300" y="98" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#6d28d9" text-anchor="start"><tspan x="300" dy="0">命中：o_dmem_rdata / o_dmem_ready 当拍就有</tspan></text>
<polyline points="790,462 790,520 150,520 150,456" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
<text x="300" y="512" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#b45309" text-anchor="start"><tspan x="300" dy="0">未命中：等 R（读）或 B（写）到达，才拉高 o_dmem_ready</tspan></text>
<text x="24" y="586" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">ITCM 命中是「组合读、一拍结束」，未命中才是「AR→R / AW→B 的多次握手」——两者在 o_dmem_ready 上汇合</tspan></text>
</svg>
