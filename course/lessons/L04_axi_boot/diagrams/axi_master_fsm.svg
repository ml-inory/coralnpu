<text x="30" y="734" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="30" dy="0">两个细节：M_RDATA 里 o_dmem_rdata 必须直接给 m_rdata（核心在 ready 那一拍就采样）；写的时候 AW 和 W 可能不同拍，所以要用 aw_pending / w_pending 各记一笔。</tspan></text>
<text x="24" y="760" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">5 个状态就够了：IDLE 抓一次请求 → 用 AXI 的多次握手把时间填满 → 用 o_dmem_ready 告诉核心「这笔完成了」</tspan></text>
