<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="714" viewBox="0 0 1180 714">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1180" height="714" fill="#ffffff"/>
<text x="24" y="32" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">L04 启动通路：主机走 s_axi 灌程序、配寄存器，然后把核心放出来</tspan></text>
<rect x="30" y="165" width="170" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="115.0" y="207.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="115.0" dy="0">主机 BFM</tspan><tspan x="115.0" dy="17.55">(tb_axi.sv)</tspan><tspan x="115.0" dy="17.55">按 5 步流程发 AXI 事务</tspan></text>
<rect x="230" y="80" width="570" height="450" rx="10" ry="10" fill="#fbfcfd" stroke="#5b6b7b" stroke-width="1.6"/>
<text x="248" y="108" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14.5" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="248" dy="0">外壳 axi_boot_shell.sv —— 你写的两个文件都装在这一层</tspan></text>
<text x="248" y="130" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="248" dy="0">TODO 1 译码 · TODO 2 ITCM · TODO 3/4 CSR 与启动控制</tspan></text>
<rect x="260" y="160" width="250" height="115" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/><text x="385.0" y="204.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="385.0" dy="0">axi_lite_slave.sv（TODO 1–5）</tspan><tspan x="385.0" dy="17.55">AW/W/B/AR/R 五通道</tspan><tspan x="385.0" dy="17.55">↕ 翻译成一组本地读写信号</tspan></text>
<rect x="260" y="335" width="250" height="120" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="385.0" y="373.225" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="385.0" dy="0">地址译码 + 读 mux + 响应码（TODO 1）</tspan><tspan x="385.0" dy="17.55">命中 ITCM / CSR → OKAY</tspan><tspan x="385.0" dy="17.55">其它地址 → SLVERR</tspan><tspan x="385.0" dy="17.55">rd_hit_* 决定读 mux 选 ITCM 还是 CSR</tspan></text>
<rect x="570" y="160" width="215" height="115" rx="8" ry="8" fill="#f0e9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="677.5" y="204.5" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="677.5" dy="0">ITCM  tcm.sv（TODO 2）</tspan><tspan x="677.5" dy="17.55">8 KB @ 0x0000_0000</tspan><tspan x="677.5" dy="17.55">主机写口 + 3 个组合读口</tspan></text>
<rect x="570" y="335" width="215" height="120" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="677.5" y="373.225" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="677.5" dy="0">三个控制寄存器（TODO 3/4）</tspan><tspan x="677.5" dy="17.55">RESET_CONTROL @0x30000</tspan><tspan x="677.5" dy="17.55">PC_START @0x30004</tspan><tspan x="677.5" dy="17.55">STATUS @0x30008</tspan></text>
<rect x="920" y="160" width="235" height="295" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="1037.5" y="241.85000000000002" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="1037.5" dy="0">核心 core_l04</tspan><tspan x="1037.5" dy="17.55">（课程提供）</tspan><tspan x="1037.5" dy="17.55"></tspan><tspan x="1037.5" dy="17.55">= L03b 流水线核</tspan><tspan x="1037.5" dy="17.55">+ i_pc_start</tspan><tspan x="1037.5" dy="17.55">+ o_fault</tspan><tspan x="1037.5" dy="17.55"></tspan><tspan x="1037.5" dy="17.55">复位后从</tspan><tspan x="1037.5" dy="17.55">PC_START 取指</tspan></text>
<path d="M 202 220 L 256 220" fill="none" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="228" y="208" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="228" dy="0">s_axi</tspan></text>
<path d="M 330 277 L 330 331" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 440 331 L 440 277" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="340" y="290" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="340" dy="0">写口：o_wr_en 单拍脉冲</tspan></text>
<text x="430" y="318" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#6d28d9" text-anchor="end"><tspan x="430" dy="0">读：o_rd_addr / i_rd_data</tspan></text>
<path d="M 512 380 L 566 250" fill="none" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="539.0" y="309.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="539.0" dy="0">wr_hit_itcm</tspan></text>
<path d="M 512 395 L 566 395" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrowhead)"/><text x="539.0" y="389.0" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="539.0" dy="0">wr_hit_csr</tspan></text>
<path d="M 785 335 L 785 300" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrowhead)" stroke-dasharray="6 4"/>
<polyline points="785,300 900,300 900,240 916,240" fill="none" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="806" y="214" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start"><tspan x="806" dy="0">启动控制 3 根</tspan></text>
<text x="806" y="236" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#0f766e" text-anchor="start"><tspan x="806" dy="0">clk_gate</tspan></text>
<text x="806" y="258" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#0f766e" text-anchor="start"><tspan x="806" dy="0">rst · pc_start</tspan></text>
<polyline points="1040,458 1040,505 700,505 700,458" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
<text x="710" y="498" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#b45309" text-anchor="start"><tspan x="710" dy="0">状态回送：i_core_halted / i_core_fault → STATUS</tspan></text>
<text x="30" y="570" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="30" dy="0">① 写 ITCM：主机从 0x0 起逐个字写程序（wr_hit_itcm → tcm 的 host_we）</tspan></text>
<text x="30" y="594" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="30" dy="0">② 写 PC_START：0x30004 ← 0x100，再读回确认；此刻核心还没动（复位 + 时钟门控）</tspan></text>
<text x="30" y="618" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="30" dy="0">③ 放开时钟门控：RESET_CONTROL ← 0x1（RESET 仍为 1）——核心第一次有时钟沿，就地被复位</tspan></text>
<text x="30" y="642" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="30" dy="0">④ 放开复位：RESET_CONTROL ← 0x0 ——下一个时钟沿把 PC ← PC_START，开始取指</tspan></text>
<text x="30" y="666" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="30" dy="0">⑤ 轮询 STATUS：读 0x30008，HALTED=1（执行了 mpause）或 FAULT=1（跑飞了）</tspan></text>
<text x="24" y="700" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">两条通路在 ITCM 和 CSR 上汇合：主机写 ITCM 决定核心跑什么，主机写 CSR 决定核心什么时候跑</tspan></text>
</svg>
