<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1080" height="470" fill="#ffffff"/>
<text x="24" y="32" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">AXI 站在系统框图的哪里：主设备 — 互连 — 从设备</tspan></text>
<rect x="60" y="70" width="220" height="70" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="170.0" y="100.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="170.0" dy="0">主机 CPU</tspan><tspan x="170.0" dy="17.55">(master)</tspan></text>
<rect x="320" y="70" width="220" height="70" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="430.0" y="100.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="430.0" dy="0">DMA 引擎</tspan><tspan x="430.0" dy="17.55">(master)</tspan></text>
<rect x="580" y="70" width="220" height="70" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/><text x="690.0" y="100.9375" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="690.0" dy="0">其它加速器</tspan><tspan x="690.0" dy="17.55">(master)</tspan></text>
<rect x="60" y="200" width="960" height="70" rx="8" ry="8" fill="#f3f5f7" stroke="#1f2933" stroke-width="1.6"/><text x="540.0" y="239.55" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle"><tspan x="540.0" dy="0">AXI 互连：按地址映射转发 + 仲裁（crossbar / NoC）</tspan></text>
<rect x="60" y="340" width="240" height="78" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/><text x="180.0" y="375.09999999999997" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="180.0" dy="0">CoralNPU 的 s_axi</tspan><tspan x="180.0" dy="17.55">（本课：axi_lite_slave + CSR）</tspan></text>
<rect x="400" y="340" width="220" height="78" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/><text x="510.0" y="375.09999999999997" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="510.0" dy="0">存储器</tspan><tspan x="510.0" dy="17.55">ITCM / DTCM / DDR</tspan></text>
<rect x="700" y="340" width="220" height="78" rx="8" ry="8" fill="#f0e9fe" stroke="#6d28d9" stroke-width="1.6"/><text x="810.0" y="375.09999999999997" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle"><tspan x="810.0" dy="0">外设</tspan><tspan x="810.0" dy="17.55">UART / SPI / GPIO</tspan></text>
<path d="M 170 144 L 170 196" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 430 144 L 430 196" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 690 144 L 690 196" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="180" y="175" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="180" dy="0">AXI</tspan></text>
<path d="M 180 274 L 180 336" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 510 274 L 510 336" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 810 274 L 810 336" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="190" y="308" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="190" dy="0">s_axi</tspan></text>
<polyline points="300,340 300,310 980,310 980,274" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
<text x="470" y="302" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#b45309" text-anchor="start"><tspan x="470" dy="0">m_axi：CoralNPU 作为主设备，去访问系统存储器/外设</tspan></text>
<text x="24" y="442" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">主端口（master）能发起事务；从端口（slave）被动响应；互连按地址把请求转发给对应的从设备。</tspan></text>
<text x="24" y="456" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">同一个 CoralNPU：主机通过它的从端口控制它，它通过自己的主端口替主机干活</tspan></text>
</svg>
