<svg xmlns="http://www.w3.org/2000/svg" width="790" height="410" viewBox="0 0 790 410">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="790" height="410" fill="#ffffff"/>
<text x="24" y="32" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">对拍：为什么它比「看波形」更快</tspan></text>
<rect x="24" y="60" width="300" height="150" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="174" y="86" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle"><tspan x="174" dy="0">Python 黄金模型</tspan></text>
<text x="40" y="112" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">00000000 00018117 02 00018000</tspan></text>
<text x="40" y="132" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">00000004 ff010113 02 00017ff0</tspan></text>
<text x="40" y="152" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="40" dy="0">00000008 00010197 03 00010008</tspan></text>
<text x="40" y="172" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="40" dy="0">... 共 58 行</tspan></text>
<rect x="24" y="236" width="300" height="150" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/>
<text x="174" y="262" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle"><tspan x="174" dy="0">你的 RTL 仿真</tspan></text>
<text x="40" y="288" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="start"><tspan x="40" dy="0">00000000 00018117 00 00000000</tspan></text>
<text x="40" y="308" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="start"><tspan x="40" dy="0">                            ↑</tspan></text>
<text x="40" y="330" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="start"><tspan x="40" dy="0">第 1 条就不同：rd/wdata 没接</tspan></text>
<path d="M 330 135 L 420 135" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<path d="M 330 311 L 420 311" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="430" y="60" width="330" height="326" rx="8" ry="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="595" y="92" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle"><tspan x="595" dy="0">检查器输出</tspan></text>
<text x="452" y="124" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="452" dy="0">第 1 条指令不一致（pc=0x00000000）：</tspan></text>
<text x="452" y="148" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="452" dy="0">指令 : auipc sp, 0x18   机器码 0x00018117</tspan></text>
<text x="452" y="172" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#0f766e" text-anchor="start"><tspan x="452" dy="0">期望 : pc=0x00000000 rd=02 wdata=0x00018000</tspan></text>
<text x="452" y="196" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#b91c1c" text-anchor="start"><tspan x="452" dy="0">实际 : pc=0x00000000 rd=00 wdata=0x00000000</tspan></text>
<text x="452" y="228" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="452" dy="0">提示 : U 型立即数是高 20 位，auipc 还要加 PC</tspan></text>
<text x="452" y="268" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start"><tspan x="452" dy="0">它直接告诉你：</tspan></text>
<text x="452" y="292" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="452" dy="0">• 哪条指令错了（pc + 反汇编）</tspan></text>
<text x="452" y="314" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="452" dy="0">• 期望值和你算出来的值的差异</tspan></text>
<text x="452" y="336" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start"><tspan x="452" dy="0">• 该去查哪个知识点</tspan></text>
<text x="452" y="364" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="452" dy="0">波形只在需要看时序时再打开。</tspan></text>
<text x="24" y="396" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">图 7  trace 对拍把「调试」变成了「读错误信息」</tspan></text>
</svg>
