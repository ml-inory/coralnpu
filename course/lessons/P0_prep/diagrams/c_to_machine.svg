<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="320" viewBox="0 0 1090 320">
<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs>
<rect width="1090" height="320" fill="#ffffff"/>
<text x="24" y="34" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">从 C 源码到内存里的机器码：四个阶段</tspan></text>
<rect x="24" y="66" width="210" height="110" rx="8" ry="8" fill="#e8effd" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="129" y="96" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14.5" font-weight="700" fill="#1d4ed8" text-anchor="middle"><tspan x="129" dy="0">hello.c</tspan></text>
<text x="129" y="122" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="129" dy="0">C 源文件</tspan></text>
<text x="129" y="142" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="129" dy="0">（人写的）</tspan></text>
<path d="M 238 121 L 278 121" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="282" y="66" width="210" height="110" rx="8" ry="8" fill="#fdf1df" stroke="#b45309" stroke-width="1.6"/>
<text x="387" y="96" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14.5" font-weight="700" fill="#b45309" text-anchor="middle"><tspan x="387" dy="0">hello.o</tspan></text>
<text x="387" y="122" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="387" dy="0">目标文件</tspan></text>
<text x="387" y="142" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="387" dy="0">机器码 + 符号（地址未定）</tspan></text>
<path d="M 496 121 L 536 121" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="540" y="66" width="210" height="110" rx="8" ry="8" fill="#e2f4f1" stroke="#0f766e" stroke-width="1.6"/>
<text x="645" y="96" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14.5" font-weight="700" fill="#0f766e" text-anchor="middle"><tspan x="645" dy="0">hello.elf</tspan></text>
<text x="645" y="122" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="645" dy="0">可执行文件</tspan></text>
<text x="645" y="142" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="645" dy="0">段已定位到 0x0 / 0x10000</tspan></text>
<path d="M 754 121 L 794 121" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<rect x="798" y="66" width="210" height="110" rx="8" ry="8" fill="#f0e9fe" stroke="#6d28d9" stroke-width="1.6"/>
<text x="903" y="96" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="14.5" font-weight="700" fill="#6d28d9" text-anchor="middle"><tspan x="903" dy="0">内存镜像</tspan></text>
<text x="903" y="122" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="903" dy="0">program.hex → ITCM</tspan></text>
<text x="903" y="142" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="903" dy="0">data.hex → DTCM</tspan></text>
<text x="258" y="108" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="258" dy="0">编译</tspan></text>
<text x="516" y="108" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="516" dy="0">汇编 + 链接</tspan></text>
<text x="774" y="108" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="middle"><tspan x="774" dy="0">拆段</tspan></text>
<text x="24" y="214" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start"><tspan x="24" dy="0">每一步都可以单独执行、单独观察：</tspan></text>
<text x="40" y="240" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="40" dy="0">gcc -E 只看预处理     gcc -S 生成汇编</tspan></text>
<text x="40" y="264" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="40" dy="0">gcc -c 只编译成 .o    gcc -T link.ld 按链接脚本定位</tspan></text>
<text x="40" y="288" font-family="'Noto Sans Mono CJK SC','DejaVu Sans Mono',monospace" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="40" dy="0">objdump -d 反汇编     objdump -t 看符号表</tspan></text>
<text x="24" y="306" font-family="'Noto Sans CJK SC','Noto Sans CJK JP',sans-serif" font-size="13" font-weight="400" fill="#5b6b7b" text-anchor="start"><tspan x="24" dy="0">图：课程脚本 course/tools/build_program.py 就是把最后一步自动化了</tspan></text>
</svg>
